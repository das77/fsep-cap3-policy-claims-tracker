# HTTP -> HTTPS redirect. All plaintext traffic is bounced to HTTPS before
# it ever reaches the SPA or the API proxy below.
server {
    listen 80;
    server_name _;

    # The redirect target must include :8443 explicitly. nginx only knows it
    # is listening on container port 443 — it has no visibility into
    # docker-compose.prod.yml's host-side "8443:443" mapping, so a bare
    # "https://$host" (implying the default port 443) sends browsers to a
    # port nothing is published on, and the redirect appears to silently
    # fail even though nginx returned a valid 301.
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A plain HTTP request landing here (stale bookmark/tab pointed at
    # :8443, browser retrying without a scheme, etc.) fails the TLS
    # handshake and nginx answers with its built-in error code 497. Left
    # unhandled that renders as a raw "400 Bad Request" with the text "The
    # plain HTTP request was sent to HTTPS port". Redirect it to the HTTPS
    # URL instead, same as the real port-80 redirect above.
    error_page 497 https://$host:8443$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long-cache hashed build assets (Vite fingerprints filenames on every build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api/ to the backend container so the built SPA can reach it under
    # the same origin, the same way the Vite dev server's proxy does. Assumes
    # a container/service named "api" reachable on port 3000 (see the "api"
    # service in docker-compose.yml) — adjust if deployed under a different
    # name/port.
    #
    # The upstream is resolved through a variable + Docker's embedded DNS
    # (127.0.0.11) rather than a bare hostname in proxy_pass: nginx resolves a
    # bare hostname once at startup and refuses to start at all if it can't be
    # resolved yet (e.g. this container starting before the backend, or being
    # run standalone) — the variable form resolves lazily per-request instead.
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $backend_upstream api:3000;
        # $request_uri (the original, unmodified request path + query string)
        # is appended explicitly: proxy_pass with a variable upstream does
        # not do the usual "replace the matched location prefix" rewriting,
        # so appending our own /api/ here would double it up (/api/api/...).
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routing: fall back to index.html for any
    # path that isn't a real static file, instead of nginx 404-ing on
    # direct loads/refreshes of routes like /claims/:id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
